name: Context Review

# Review arbitrarily long inputs with rolling summaries. Each turn sends only
# the accumulated summary and the next chunk (upstream limit: ~19,500 characters).
on:
  workflow_dispatch:
    inputs:
      path:
        description: File to review
        default: README.md
      model:
        description: Model ID
        default: gpt-5.6-luna
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 02:00 UTC

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (offline)
        run: python3 scripts/context_review.py --self-test

      - name: Review
        env:
          BASE_URL: ${{ vars.DUCK2API_BASE_URL }}
          AUTH_KEY: ${{ secrets.DUCK2API_AUTH_KEY }}
          MODEL: ${{ inputs.model || 'gpt-5.6-luna' }}
          TARGET: ${{ inputs.path || 'README.md' }}
        run: |
          test -n "$BASE_URL" || { echo "::error::Set repository variable DUCK2API_BASE_URL (for example https://xxx.koyeb.app/v1)"; exit 1; }
          python3 scripts/context_review.py --input "$TARGET" --out review.md --model "$MODEL"
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: context-review
          path: review.md
